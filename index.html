<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332C">
<title>학생맞춤통합지원센터 주문이요~</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ 토큰 ============ */
:root{
  --ground:#DFE6E1;      /* 세이지 바탕 */
  --ground-d:#CBD7CF;
  --paper:#FFFFFF;
  --ink:#12332C;         /* 딥 파인 */
  --ink-2:#4E675E;
  --ink-3:#7E948B;
  --line:#C3D0C9;
  --lunch:#C77A06;       /* 점심 = 낮 */
  --lunch-bg:#FBF0DC;
  --dinner:#2E5E8C;      /* 저녁 = 밤 */
  --dinner-bg:#E3ECF5;
  --alert:#B23A2C;
  --alert-bg:#FAE7E4;
  --ok:#2E7D5B;
  --ok-bg:#E1F0E8;
  --r:14px;
  --mono:"IBM Plex Mono","Pretendard Variable",monospace;
  --disp:"Hahmlet","Pretendard Variable",serif;
  --body:"Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ 레이아웃 ============ */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 96px}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#EAF1ED;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em;
  text-decoration:none;color:#EAF1ED;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.brand-hi{color:var(--lunch)}
.brand-short{display:none}
@media (max-width:620px){
  .brand-long{display:none}
  .brand-short{display:inline}
  .brand{font-size:17px}
}
.topbar nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;min-width:0;flex:0 1 auto}
.btn-out{flex:0 0 auto;background:transparent;border:1.5px solid #4E675E;color:#EAF1ED;
  font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;
  white-space:nowrap;margin-left:6px}
.btn-out:hover{background:rgba(255,255,255,.14)}
@media (max-width:620px){ .btn-out{font-size:12px;padding:5px 10px;margin-left:4px} }
.topbar nav::-webkit-scrollbar{display:none}
.topbar nav a{
  color:#B9CCC3;text-decoration:none;font-size:14px;font-weight:600;
  padding:7px 12px;border-radius:999px;white-space:nowrap
}
.topbar nav a:hover{color:#fff;background:rgba(255,255,255,.09)}
.topbar nav a[aria-current]{background:#EAF1ED;color:var(--ink)}

h1.page{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.5vw,36px);
  letter-spacing:-.03em;margin:28px 0 4px;line-height:1.2}
p.lede{color:var(--ink-2);margin:0 0 22px;font-size:15px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ============ 폼 ============ */
label.f{display:block;font-size:12.5px;font-weight:700;letter-spacing:.04em;
  color:var(--ink-2);text-transform:uppercase;margin:0 0 6px}
.input,select.input,textarea.input{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none
}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,51,44,.12)}
textarea.input{min-height:90px;resize:vertical}

.btn{
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;
  padding:11px 18px;border-radius:10px;cursor:pointer;transition:transform .06s ease,opacity .15s
}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible,.input:focus-visible{
  outline:3px solid var(--lunch);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.wide{width:100%;justify-content:center}
.btn.warn{border-color:var(--alert);background:var(--alert)}
.btn.good{border-color:var(--ok);background:var(--ok)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ============ 배지 ============ */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;line-height:1.6}
.tag.lunch{color:var(--lunch);background:var(--lunch-bg)}
.tag.dinner{color:var(--dinner);background:var(--dinner-bg)}
.tag.s-요청{color:var(--alert);background:var(--alert-bg)}
.tag.s-접수{color:var(--dinner);background:var(--dinner-bg)}
.tag.s-준비완료{color:var(--ok);background:var(--ok-bg)}
.tag.s-픽업완료{color:var(--ink-3);background:#EEF2F0}
.tag.s-취소{color:var(--ink-3);background:#EEF2F0;text-decoration:line-through}

/* ============ 전표(시그니처) ============ */
.ticket{position:relative;background:var(--paper);border:1px solid var(--line);
  border-bottom:none;border-radius:var(--r) var(--r) 0 0;padding:16px 16px 14px}
.ticket-tear{height:9px;background:var(--paper);border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  -webkit-mask-image:radial-gradient(circle at 50% 100%,transparent 4.6px,#000 5.1px);
  mask-image:radial-gradient(circle at 50% 100%,transparent 4.6px,#000 5.1px);
  -webkit-mask-size:11px 9px;mask-size:11px 9px;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;margin-bottom:14px}
.ticket.meal-lunch{border-top:4px solid var(--lunch)}
.ticket.meal-dinner{border-top:4px solid var(--dinner)}
.ticket-hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.ticket-no{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:-.02em}
.ticket-who{font-weight:800;font-size:16px}
.ticket-sub{font-size:13px;color:var(--ink-2)}
.ticket-lines{border-top:1px dashed var(--line);margin-top:10px;padding-top:9px}
.tl{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:2px 0}
.tl b{font-weight:600}
.tl .q{font-family:var(--mono);color:var(--ink-2);flex:0 0 auto}
.ticket-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);
  margin-top:9px;padding-top:9px;font-weight:800}
.ticket-total .mono{font-size:17px}
.ticket-memo{margin-top:9px;background:var(--lunch-bg);border-left:3px solid var(--lunch);
  padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px}
.ticket-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ============ 메뉴/식당 ============ */
.picklist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pick{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
  padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--ink);background:#EFF4F1;box-shadow:inset 0 0 0 1.5px var(--ink)}
.pick .nm{font-weight:800;font-size:16px}
.pick .mt{font-size:13px;color:var(--ink-2);margin-top:2px}
.pick.closed{opacity:.5}

.menu-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.menu-row:last-child{border-bottom:none}
.mgroup{border-bottom:1px solid var(--line)}
.mgroup:last-of-type{border-bottom:none}
.mgroup>summary{cursor:pointer;list-style:none;padding:12px 2px;font-family:var(--disp);
  font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:9px}
.mgroup>summary::-webkit-details-marker{display:none}
.mgroup>summary::before{content:'▸';color:var(--ink-3);font-size:13px;transition:transform .15s}
.mgroup[open]>summary::before{transform:rotate(90deg)}
.mgroup>summary .cnt{font-family:var(--mono);font-size:12px;background:var(--ground);
  color:var(--ink-2);border-radius:999px;padding:1px 8px;font-weight:600}
.mgroup>summary:hover{color:var(--lunch)}
.menu-row .nm{flex:1;min-width:0;font-weight:600}
.menu-row .pr{font-family:var(--mono);color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:36px;height:36px;border:none;background:#fff;font-size:19px;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--ground)}
.stepper .n{width:34px;text-align:center;font-family:var(--mono);font-weight:600;
  border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);line-height:36px}

/* 장바구니 고정바 */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(0,0,0,.16)}
.cartbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px}
.cartbar .sum{flex:1;min-width:0;font-size:14px;color:#B9CCC3}
.cartbar .sum b{color:#fff;font-size:17px;font-family:var(--mono)}
.cartbar .btn:not(.ghost){background:var(--lunch);border-color:var(--lunch);color:#22160A}

/* 식당 보드 */
.board{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);align-items:start}
.col-hd{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;
  font-size:17px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.col-hd .cnt{font-family:var(--mono);font-size:13px;background:var(--ink);color:#fff;
  border-radius:999px;padding:1px 9px;margin-left:auto}
.col-body{display:grid;gap:14px}
@media (max-width:860px){ .board{grid-template-columns:1fr} }

.newflash{animation:drop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(-.6deg)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,44,.5)}50%{box-shadow:0 0 0 10px rgba(178,58,44,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;
  color:var(--ink-2);font-size:14.5px;background:rgba(255,255,255,.5)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);border-bottom:2px solid var(--ink);padding:8px 8px}
.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.scroller{overflow-x:auto}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 15px;font-weight:700;font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;
  font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:90vw;text-align:center}
.banner{background:var(--alert);color:#fff;border-radius:12px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;font-weight:700}
.banner .btn{background:#fff;color:var(--alert);border-color:#fff;margin-left:auto}
.note{font-size:13px;color:var(--ink-2)}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}

.home-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:8px}
.home-card{display:block;text-decoration:none;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r);padding:22px;transition:border-color .15s,transform .12s}
.home-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.home-card .k{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.1em}
.home-card h3{font-family:var(--disp);font-weight:800;font-size:21px;margin:6px 0 5px;letter-spacing:-.02em}
.home-card p{margin:0;font-size:14px;color:var(--ink-2)}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">
      <span class="brand-long">학생맞춤통합지원센터</span><span class="brand-short">학맞통</span>
      <span class="brand-hi">주문이요~</span>
    </a>
    <nav id="nav"></nav>
    <button class="btn-out" id="out" data-act="signout" hidden>나가기</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

/* ═══════════════════════════════════════════════════
   ① 설정 — 이 부분만 채우면 됩니다
   ═══════════════════════════════════════════════════ */
const CFG = {
  SUPABASE_URL:      'https://xbnytevptiuxurkebiqe.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_0GX8fmjg_49dAno-pvZt0A_p5BOiADO',
  ORDER_CUTOFF_NOTE: '병아리김밥은 19:30까지 · 어스샌드위치는 20:30까지 주문받습니다. 특근매식비 장부에 날짜·금액·이름 기재를 잊지 마세요.',
  // 로그인 화면에 보일 계정 목록. Supabase Authentication 에 만든 이메일과 맞춰주세요.
  ACCOUNTS: [
    { label: '센터 (주문)',  email: 'center@ice.local' },
    { label: '병아리김밥',   email: 'byeongari@ice.local' },
    { label: '어스샌드위치', email: 'ussandwich@ice.local' },
    { label: '관리자',       email: 'admin@ice.local' }
  ]
};
/* ═══════════════════════════════════════════════════ */

const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  realtime: { params: { eventsPerSecond: 5 } }
});

/* ---------- 유틸 ---------- */
const $  = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n || 0).toLocaleString('ko-KR');
const ls  = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('mo:' + k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem('mo:' + k, JSON.stringify(v)); }
};
function kstToday() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul',
    year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
const todayStartISO = () => new Date(kstToday() + 'T00:00:00+09:00').toISOString();
function hhmm(iso) {
  if (!iso) return '';
  return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul',
    hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
}
function nowHM(add = 0) {
  const d = new Date(Date.now() + add * 60000);
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul',
    hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
}
async function sha256(str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mo.' + str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg; d.setAttribute('role', 'status');
  document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2800);
}
function fail(e) { console.error(e); toast('처리하지 못했습니다 · ' + (e?.message || e)); }

/* ---------- 알림음 ---------- */
let actx;
function beep(times = 3) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    for (let i = 0; i < times; i++) {
      const t = actx.currentTime + i * 0.42;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, t);
      o.frequency.setValueAtTime(1245, t + 0.13);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.32);
    }
  } catch (e) { /* 소리 실패는 무시 */ }
}
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: './icon-192.png', tag: 'mo-' + Date.now() }); } catch {}
}

/* ---------- 상태 ---------- */
const S = {
  orgs: [], orderers: [], restaurants: [], menu: [],
  cart: {},                                    // menuId → {name, price, qty}
  memo: '',
  seen: new Set(),                             // 이미 알린 주문 id
  ctx:  ls.get('ctx', { orgId: '', ordererId: '', meal: 'lunch', pickup: '' }),
  me:   null,                                  // {role, restaurantId, label}
  shop: null,                                  // 식당 계정일 때 {id, name}
  restId: '', adminDate: '',
  chan: null, timer: null
};
const MEAL = { lunch: '점심', dinner: '저녁' };
const ORDERED = ['요청', '접수', '준비완료', '픽업완료', '취소'];

async function loadBase() {
  const [o, u, r] = await Promise.all([
    sb.from('orgs').select('*').eq('active', true).order('sort'),
    sb.from('orderers').select('*').eq('active', true).order('sort'),
    sb.from('restaurants').select('*').order('sort')
  ]);
  if (o.error) throw o.error;
  S.orgs = o.data || []; S.orderers = u.data || []; S.restaurants = r.data || [];
}

/* ═══════════ 렌더링 공통 ═══════════ */
function ticket(o, opts = {}) {
  const items = (o.order_items || []).map(i =>
    `<div class="tl"><b>${esc(i.menu_name)}${i.options ? ` <span class="note">(${esc(i.options)})</span>` : ''}</b>
       <span class="q">${i.qty}개 · ${won(i.line_total)}</span></div>`).join('');
  const org = o.orgs?.name || o.org_name || '';
  const rest = o.restaurants?.name || o.rest_name || '';
  return `
  <article class="tkt-wrap" data-id="${o.id}">
    <div class="ticket meal-${o.meal}">
      <div class="ticket-hd">
        <span class="ticket-no">${esc(o.order_no || '—')}</span>
        <span class="tag ${o.meal}">${MEAL[o.meal]}</span>
        <span class="tag s-${o.status}">${o.status}</span>
        <span class="ticket-sub mono" style="margin-left:auto">${hhmm(o.created_at)} 접수</span>
      </div>
      <div class="ticket-who">${esc(o.orderer_name)} <span style="font-weight:500;color:var(--ink-2)">· ${esc(org)}</span></div>
      <div class="ticket-sub">${opts.showRest !== false && rest ? esc(rest) + ' · ' : ''}픽업 <b class="mono">${esc(o.pickup_at || '-')}</b></div>

  await loadBase();
  if (!S.ctx.pickup) S.ctx.pickup = nowHM(40);
  if (!S.restId && S.restaurants.length) S.restId = S.restaurants.find(r => r.is_open)?.id || '';
  await loadMenu();
  paintOrder();

  // 내 기관 주문의 상태가 바뀌면 바로 다시 그리고, 준비완료/취소는 알려줍니다
  if (S.ctx.orgId) {
    S.chan = sb.channel('mine-' + S.ctx.orgId).on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'orders', filter: 'org_id=eq.' + S.ctx.orgId },
      p => {
        const o = p.new;
        if (o.status === '준비완료' && !S.seen.has(o.id + '준비완료')) {
          S.seen.add(o.id + '준비완료'); beep(2);

          notify('주문이 취소됐습니다', `주문 ${o.order_no} · ${o.cancel_reason || ''}`);

function cartTotal() {

function cartCount() {

/* 장바구니 바는 app 바깥(body)에 붙여, 메뉴를 담아도 화면 전체가 새로 그려지지 않게 합니다 */
/* 메뉴가 많은 가게(70여 종)를 위해 분류별로 접었다 펼 수 있게 묶습니다 */
function menuHTML() {
  const groups = new Map();
  S.menu.forEach(m => {
    const k = m.category || '메뉴';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  });
  const one = m => {
    const q = S.cart[m.id]?.qty || 0;
    return `<div class="menu-row" ${m.available ? '' : 'style="opacity:.45"'}>
      <span class="nm">${esc(m.name)}${m.available ? '' : ' · 품절'}</span>
      <span class="pr">${won(m.price)}원</span>
      ${m.available ? `<span class="stepper">
        <button data-act="minus" data-v="${m.id}" aria-label="${esc(m.name)} 빼기">−</button>
        <span class="n" data-n="${m.id}">${q}</span>
        <button data-act="plus" data-v="${m.id}" aria-label="${esc(m.name)} 담기">+</button>
      </span>` : ''}
    </div>`;
  };
  if (groups.size <= 1) return S.menu.map(one).join('');
  return [...groups].map(([k, arr], i) =>
    `<details class="mgroup" ${i === 0 ? 'open' : ''}>
       <summary>${esc(k)} <span class="cnt">${arr.length}</span></summary>
       ${arr.map(one).join('')}
     </details>`).join('');
}

async function paintMine() {
  const box = $('#mine'); if (!box) return;
  if (!S.ctx.orgId) { box.innerHTML = `<div class="note">기관을 고르면 오늘 주문이 보입니다.</div>`; return; }
  const { data, error } = await sb.from('orders')
    .select('*, order_items(*), orgs(name), restaurants(name)')
    .eq('org_id', S.ctx.orgId).gte('created_at', todayStartISO())
    .order('created_at', { ascending: false });
  if (error) return fail(error);
  box.innerHTML = data.length
    ? data.map(o => ticket(o, {
        actions: o.status === '요청'
          ? `<button class="btn sm warn" data-act="cancel" data-v="${o.id}">주문 취소</button>` : ''
      })).join('')
    : `<div class="empty">아직 오늘 주문이 없습니다.</div>`;
}

async function submitOrder() {
  if (!S.ctx.orgId)      return toast('기관을 골라주세요');
  if (!S.ctx.ordererId)  return toast('주문자를 골라주세요');
  if (!S.restId)         return toast('식당을 골라주세요');
  if (!cartCount())      return toast('메뉴를 담아주세요');

  const btn = document.querySelector('[data-act="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = '보내는 중…'; }

  const u = S.orderers.find(x => x.id === S.ctx.ordererId);
  const memo = (S.memo || '').trim();
  try {
    const { data: o, error } = await sb.from('orders').insert({
      restaurant_id: S.restId, org_id: S.ctx.orgId, orderer_id: S.ctx.ordererId,
      orderer_name: u?.name || '주문자', meal: S.ctx.meal,
      pickup_at: S.ctx.pickup, total: cartTotal(), memo: memo || null
    }).select().single();
    if (error) throw error;

    const rows = Object.values(S.cart).map(i => ({
      order_id: o.id, menu_name: i.name, unit_price: i.price,
      qty: i.qty, line_total: i.price * i.qty
    }));
    const { error: e2 } = await sb.from('order_items').insert(rows);
    if (e2) { await sb.from('orders').delete().eq('id', o.id); throw e2; }

    S.cart = {}; S.memo = '';
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch {}
    }
    toast(`주문 ${o.order_no} 보냈습니다`);
    paintOrder();
  } catch (e) {
    fail(e);
    if (btn) { btn.disabled = false; btn.textContent = '주문 넣기'; }
  }
}

  const stamp = { '접수': 'accepted_at', '준비완료': 'ready_at', '픽업완료': 'done_at' }[st];
  const patch = { status: st };
  if (stamp) patch[stamp] = new Date().toISOString();
  if (st === '취소') {
    const why = prompt('취소 사유를 적어주세요 (주문자 화면에 보입니다)', '재료 소진');
    if (why === null) return;
    patch.cancel_reason = why || '식당 사정';
  }
  const { error } = await sb.from('orders').update(patch).eq('id', id);
  if (error) return fail(error);
  toast(st + ' 처리했습니다');
  if (document.querySelector('.board')) paintShop();
  else if (document.querySelector('#mine')) paintMine();
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  try {
    switch (a) {
      case 'meal':  S.ctx.meal = v; ls.set('ctx', S.ctx); paintOrder(); break;
      case 'rest':  S.restId = v; S.cart = {}; await loadMenu(); paintOrder(); break;
      case 'plus': {
        const m = S.menu.find(x => x.id === v);
        S.cart[v] = S.cart[v] || { name: m.name, price: m.price, qty: 0 };
        S.cart[v].qty++; refreshCart(); break;
      }
      case 'minus':
        if (S.cart[v] && --S.cart[v].qty <= 0) delete S.cart[v];
        refreshCart(); break;
      case 'clear':  S.cart = {}; refreshCart(); break;
      case 'submit': await submitOrder(); break;
      case 'cancel':
        if (confirm('이 주문을 취소할까요?')) await setStatus(v, '취소');
        break;

      case 'signin':  await signIn(); break;
      case 'signout':
        ev.preventDefault();
        if (!confirm('로그아웃할까요? 다시 들어올 때 비밀번호를 넣어야 합니다.')) return;
        await forceSignOut(); break;
      case 'testsound': beep(2); if ('Notification' in window) Notification.requestPermission?.(); break;
      case 'st':        await setStatus(v, t.dataset.s); break;
      case 'toggleopen': {
        const r = S.restaurants.find(x => x.id === S.shop.id);
        await sb.from('restaurants').update({ is_open: !r.is_open }).eq('id', S.shop.id);
        await loadBase(); paintShop(); break;
      }

      case 'tab': adminTab = v; paintAdmin(); break;

      case 'delOrder': {
        if (!confirm('이 주문 기록을 지울까요? 되돌릴 수 없습니다.')) return;
        const { error } = await sb.from('orders').delete().eq('id', v);
        if (error) return fail(error);
        toast('삭제했습니다');
        if (adminTab === 'orders' && S.me?.role === 'admin') paintAdmin(); else paintBoard();
        break;
      }
      case 'delDay': {
        const d = S.adminDate || kstToday();
        if (!confirm(d + ' 의 주문을 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?')) return;
        const from = new Date(d + 'T00:00:00+09:00').toISOString();
        const to   = new Date(new Date(d + 'T00:00:00+09:00').getTime() + 864e5).toISOString();
        const { error } = await sb.from('orders').delete()
          .gte('created_at', from).lt('created_at', to);
        if (error) return fail(error);
        toast('해당 날짜 주문을 모두 삭제했습니다');
        paintAdmin(); break;
      }
      case 'addOrg': {
        const nm = $('#nOrg').value.trim(); if (!nm) return toast('기관명을 넣어주세요');
        await sb.from('orgs').insert({ name: nm, sort: S.orgs.length + 1 });
        await loadBase(); paintAdmin(); toast('기관을 추가했습니다'); break;
      }
      case 'delOrg':
        if (!confirm('삭제하면 그 기관의 주문자도 함께 지워집니다. 계속할까요?')) return;
        await sb.from('orgs').delete().eq('id', v);
        await loadBase(); paintAdmin(); break;
      case 'addUser': {
        const nm = $('#uName').value.trim(); if (!nm) return toast('주문자 이름을 넣어주세요');
        await sb.from('orderers').insert({ org_id: $('#uOrg').value, name: nm,
          note: $('#uNote').value.trim() || null, sort: S.orderers.length + 1 });
        await loadBase(); paintAdmin(); toast('주문자를 추가했습니다'); break;
      }
      case 'delUser':
        await sb.from('orderers').delete().eq('id', v);
        await loadBase(); paintAdmin(); break;
      case 'addRest': {
        const nm = $('#rName').value.trim(); if (!nm) return toast('가게 이름을 넣어주세요');
        await sb.from('restaurants').insert({
          name: nm, category: $('#rCat').value.trim() || null,
          phone: $('#rPhone').value.trim() || null, walk_note: $('#rWalk').value.trim() || null,
          sort: S.restaurants.length + 1 });
        await loadBase(); paintAdmin(); toast('식당을 추가했습니다'); break;
      }
      case 'delRest':
        if (!confirm('삭제하면 그 가게의 메뉴도 함께 지워집니다. 지난 주문이 있으면 삭제되지 않습니다.')) return;
        { const { error } = await sb.from('restaurants').delete().eq('id', v);
          if (error) toast('지난 주문이 있어 삭제할 수 없습니다. 대신 주문 받기를 중지하세요.'); }
        await loadBase(); paintAdmin(); break;
      case 'saveNotice':
        await sb.from('restaurants').update({
          notice: document.querySelector(`[data-notice="${v}"]`).value.trim() || null }).eq('id', v);
        await loadBase(); toast('공지를 저장했습니다'); break;
      case 'addMenu': {
        const lines = $('#mBulk').value.split('\n').map(x => x.trim()).filter(Boolean);
        if (!lines.length) return toast('메뉴를 적어주세요');
        const rows = lines.map((l, i) => {
          const m = l.match(/^(.*?)[\s\t]+([\d,]+)\s*원?$/);
          return { restaurant_id: S.restId, name: m ? m[1].trim() : l,
                   price: m ? +m[2].replace(/,/g, '') : 0, sort: S.menu.length + i + 1 };
        });
        await sb.from('menu_items').insert(rows);
        await loadMenu(); paintAdmin(); toast(rows.length + '개 등록했습니다'); break;
      }
      case 'toggleMenu': {
        const m = S.menu.find(x => x.id === v);
        await sb.from('menu_items').update({ available: !m.available }).eq('id', v);
        await loadMenu(); paintAdmin(); break;
      }
      case 'delMenu':
        await sb.from('menu_items').delete().eq('id', v);
        await loadMenu(); paintAdmin(); break;
    }
  } catch (e) { fail(e); }
});

/* ═══════════ 라우팅 ═══════════ */
async function route() {
  cleanup(); navRender();
  if ((location.hash || '').startsWith('#/logout')) {   // 비상용 강제 로그아웃 주소
    if (S.me) { await forceSignOut(); return; }
    location.hash = '#/';
  }
  if (!S.me) return viewLogin();
  const h = (location.hash || '#/').split('?')[0];
  try {
    if (S.me.role === 'shop')         await viewShop();   // 식당은 이 화면만 볼 수 있습니다
    else if (h.startsWith('#/order')) await viewOrder();
    else if (h.startsWith('#/board')) await viewBoard();
    else if (h.startsWith('#/shop'))  await viewShop();
    else if (h.startsWith('#/admin')) await viewAdmin();
    else viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<h1 class="page">연결하지 못했습니다</h1>
      <p class="lede">Supabase 주소와 anon 키가 index.html 위쪽 설정에 제대로 들어갔는지 확인해 주세요.</p>
      <div class="card"><code class="mono" style="font-size:13px">${esc(e.message || e)}</code></div>`;
  }
}
window.addEventListener('hashchange', route);

/* ═══════════ 로그인 ═══════════ */
/* 통신이 끊겨 서버 응답이 없어도 이 기기에서는 반드시 로그아웃되게 합니다 */
async function forceSignOut() {
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) { console.warn(e); }
  try { await sb.auth.signOut(); } catch (e) { console.warn(e); }
  try {
    Object.keys(localStorage).filter(k => k.startsWith('sb-'))
      .forEach(k => localStorage.removeItem(k));
  } catch {}
  S.me = null; S.shop = null;
  cleanup();
  if (location.hash !== '#/') location.hash = '#/'; else route();
  toast('로그아웃했습니다');
}

function viewLogin() {
  app.innerHTML = `
    <h1 class="page">로그인</h1>
    <p class="lede">받으신 계정으로 한 번만 로그인하면, 이 기기에서는 다음부터 바로 열립니다.</p>
    <div class="card" style="max-width:420px">
      <label class="f" for="lWho">계정</label>
      <select class="input" id="lWho" style="margin-bottom:14px">
        ${CFG.ACCOUNTS.map(a => `<option value="${esc(a.email)}">${esc(a.label)}</option>`).join('')}
      </select>
      <label class="f" for="lPw">비밀번호</label>
      <input class="input" id="lPw" type="password" autocomplete="current-password" style="margin-bottom:16px">
      <button class="btn wide" data-act="signin">들어가기</button>
    </div>`;
}

async function loadMe() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { S.me = null; S.shop = null; return; }
  const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!p) { S.me = null; S.shop = null; return; }
  S.me = { role: p.role, restaurantId: p.restaurant_id, label: p.label || user.email };
  S.shop = p.role === 'shop' && p.restaurant_id
    ? { id: p.restaurant_id, name: p.label } : null;
}

async function signIn() {
  const email = $('#lWho').value, password = $('#lPw').value;
  const btn = document.querySelector('[data-act="signin"]');
  if (!password) return toast('비밀번호를 넣어주세요');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = '들어가기'; }
    return toast('비밀번호가 맞지 않습니다');
  }
  await loadMe();
  if (!S.me) {
    await sb.auth.signOut();
    return toast('이 계정에 역할이 지정되어 있지 않습니다. 관리자에게 알려주세요.');
  }
  if ('Notification' in window && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch {}
  }
  beep(1);
  location.hash = S.me.role === 'shop' ? '#/shop' : '#/order';
  route();
}

sb.auth.onAuthStateChange((e) => {
  if (e === 'SIGNED_OUT') { S.me = null; S.shop = null; cleanup(); route(); }
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await loadMe();
  route();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
